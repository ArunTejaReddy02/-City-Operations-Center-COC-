version: '3.9'

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: vizagops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vizagops
      POSTGRES_PASSWORD: vizagops_password
      POSTGRES_DB: vizagops_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vizagops -d vizagops_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Adminer (DB UI) ──────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: vizagops_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:

networks:
  default:
    name: vizagops_network
